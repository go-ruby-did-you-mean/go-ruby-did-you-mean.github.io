baseURL = "https://go-ruby-did-you-mean.github.io/"
title = "go-ruby-did-you-mean"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "Normalization"
  status = "ready"
  blurb = "Downcase and strip `@` sigils from input and every candidate, so `@ivar` and `IVar` compare alike — the first step of MRI's `SpellChecker#correct`."
[[params.phases]]
  name = "Jaro–Winkler filter & ranking"
  status = "ready"
  blurb = "Keep candidates whose Jaro–Winkler similarity clears the threshold (`0.834` for inputs longer than 3 characters, else `0.77`), drop an exact match of the original, and rank survivors by similarity descending — a stable sort then reverse, matching Ruby's tie order."
[[params.phases]]
  name = "Levenshtein mistype filter"
  status = "ready"
  blurb = "Keep the ranked candidates within an edit distance of `⌈len/4⌉` of the input, exactly as MRI's mistype filter does."
[[params.phases]]
  name = "Misspell fallback"
  status = "ready"
  blurb = "If nothing survives, return the first ranked candidate whose Levenshtein distance is strictly less than the shorter of the two word lengths — Ruby's stable-sorted, input-order fallback."
[[params.phases]]
  name = "Unicode-correct metrics"
  status = "ready"
  blurb = "`Jaro` / `JaroWinkler.distance` and `Levenshtein.distance` ported exactly, comparing Unicode code points (not bytes) like Ruby's `String#each_codepoint`, so multibyte words (`café`, `naïve`) rank identically."
[[params.phases]]
  name = "Differential oracle & coverage"
  status = "ready"
  blurb = "Golden vectors captured from MRI plus a broad corpus of typos, transpositions, case variants, multibyte words and no-match inputs fed to the system `ruby`'s `SpellChecker#correct`, reproduced byte-for-byte. 100% coverage, gofmt + go vet clean, green across all six 64-bit Go arches and three OSes."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 10.02:1, bright on the dark background 4.00:1.
  base = "#7f1d1d"
  deep = "#4d1212"
  bright = "#dc2626"
  shadow = "rgba(127,29,29,.7)"
  glow = "rgba(127,29,29,.6)"
  wash = "rgba(127,29,29,.10)"
  washDeep = "rgba(77,18,18,.06)"
  chipBg = "#fbe5e5"
  chipBorder = "#f4bebe"
  chipFg = "#4d1212"
  chipBgDark = "rgba(220,38,38,.14)"
  chipBorderDark = "rgba(220,38,38,.32)"
  chipFgDark = "#ec8888"
  statsEnd = "#f7cbcb"
  bandText = "#f9dcdc"
